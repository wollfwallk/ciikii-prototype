    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('ciikii-app-v4')
          var pref = 'dark'
          if (raw) {
            var saved = JSON.parse(raw)
            if (saved && saved.state && saved.state.theme) pref = saved.state.theme
          }
          var hour = new Date().getHours()
          var theme =
            pref === 'auto' ? (hour >= 7 && hour < 19 ? 'light' : 'dark') : pref
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
